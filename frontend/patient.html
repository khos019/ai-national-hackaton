<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bemor kartasi</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div id="hdr"></div>
<main class="grid" id="root"><div class="empty">Yuklanmoqda…</div></main>

<dialog id="obsDlg">
  <form method="dialog" id="obsForm">
    <div class="hd"><h2>Yangi ko'rsatkich kiritish</h2></div>
    <div class="bd grid">
      <div class="form-grid" id="obsFields"></div>
      <div><div class="small muted" style="margin-bottom:6px">Belgilar / shikoyatlar</div><div class="checks" id="obsSymptoms"></div></div>
      <div class="form-grid">
        <label>Manba<select name="source"><option value="clinic">Klinika (hamshira/shifokor)</option><option value="lab">Laboratoriya</option><option value="device">Qurilma</option><option value="self">O'zi kiritgan</option></select></label>
        <label>Kiritdi<input name="entered_by" placeholder="F.I.Sh."></label>
      </div>
      <label class="field">Izoh<textarea name="note" rows="2"></textarea></label>
    </div>
    <div class="ft"><button value="cancel" formnovalidate>Bekor qilish</button><button class="primary" value="save" id="obsSave">Saqlash va qayta baholash</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/assets/common.js"></script>
<script>
document.getElementById("hdr").innerHTML = headerHTML("patients");
const pid = new URLSearchParams(location.search).get("id");
let meta, P, charts = [];
const OUTCOMES = {
  "": "— hali noma'lum —", normal_delivery: "Normal tug'ruq", preeclampsia: "Preeklampsiya", eclampsia: "Eklampsiya",
  gestational_hypertension: "Gestatsion gipertenziya", gestational_diabetes: "Gestatsion diabet", anemia: "Anemiya",
  hemorrhage: "Qon ketish", infection: "Infeksiya / sepsis", preterm_birth: "Muddatidan oldin tug'ruq",
  stillbirth: "O'lik tug'ilish", cesarean: "Kesar kesish", neonatal_icu: "Chaqaloq reanimatsiyada", recovered: "Sog'aydi",
};

function reasonsHTML(reasons) {
  if (!reasons.length) return `<div class="muted">Xavf omillari aniqlanmadi — barcha ko'rsatkichlar me'yorda.</div>`;
  const cat = { parameter: "ko'rsatkich", symptom: "belgi", combo: "kombinatsiya", trend: "trend", risk_factor: "anamnez", aggregation: "MEOWS", ml: "ML" };
  return `<ul class="reasons">${reasons.map(r => `<li><span class="dot ${r.zone}"></span><div>${esc(r.label)}
    <div class="pill-row" style="margin-top:2px"><span class="badge">${cat[r.category] || r.category}</span>
    ${r.source ? `<span class="badge ${r.source === "self" ? "self" : ""}">${SOURCE_UZ[r.source]}</span>` : ""}
    ${r.observed_at ? `<span class="small muted">${fmtDate(r.observed_at)}</span>` : ""}</div></div></li>`).join("")}</ul>`;
}

function mlHTML(ml) {
  if (!ml) return `<div class="muted small">ML bahosi uchun yosh va qon bosimi kerak.</div>`;
  const pr = ml.probabilities, row = (k, l, c) => `<div class="row"><span>${l}</span><div class="bar"><span class="${c}" style="width:${(pr[k] || 0) * 100}%"></span></div><span class="small num">${Math.round((pr[k] || 0) * 100)}%</span></div>`;
  return `<div class="bars">${row("high", "Yuqori xavf", "r")}${row("mid", "O'rta xavf", "y")}${row("low", "Past xavf", "g")}</div>
    <div class="small muted" style="margin-top:6px">Model: ${esc(ml.model)} · faqat maslahat, zonani pasaytirmaydi
    ${ml.imputed.length ? `· to'ldirilgan: ${ml.imputed.join(", ")}` : ""}</div>`;
}

function chartCard(id, title) { return `<div class="card"><div class="hd"><h2>${title}</h2></div><div class="bd"><div class="chart-box"><canvas id="${id}"></canvas></div></div></div>`; }

function render() {
  const p = P, isM = p.kind === "mother";
  const k = isM ? "mother" : "newborn";
  const rfs = meta[k].risk_factors;
  const info = isM
    ? `<dt>Yoshi</dt><dd>${p.age ?? "—"}</dd><dt>Homila muddati</dt><dd>${p.gestational_weeks ?? "—"} hafta</dd>
       <dt>Taxminiy tug'ruq</dt><dd>${fmtDate(p.edd, false)}</dd><dt>Tug'ruqlar soni</dt><dd>${p.parity ?? "—"}</dd>`
    : `<dt>Yoshi</dt><dd>${p.age_days} kun</dd><dt>Tug'ilgandagi vazn</dt><dd>${p.birth_weight_g} g</dd>
       <dt>Gestatsiya</dt><dd>${p.gestational_age_at_birth} hafta</dd><dt>Apgar (5 daq)</dt><dd>${p.apgar5}</dd>`;
  document.getElementById("root").innerHTML = `
  <div class="card"><div class="hd">
    ${zoneChip(p.zone)} <h2 style="font-size:18px">${esc(p.full_name)}</h2>
    <span class="muted">${KIND_UZ[p.kind]} · ID ${p.id} · ${esc(p.district)}</span>
    ${p.telegram_linked ? `<span class="badge self">Telegram ulangan</span>` : `<span class="badge">Telegram ulanmagan</span>`}
    <div class="filters"><button class="primary" id="addObs">+ Ko'rsatkich kiritish</button></div>
  </div></div>

  <div class="grid cols-main">
    <div class="grid" style="align-content:start">
      <div class="card"><div class="hd"><h2>Nima uchun ${ZONE_UZ[p.zone].toLowerCase()} zona?</h2><span class="small muted">Yangilangan: ${ago(p.zone_updated_at)}</span></div>
        <div class="bd">${reasonsHTML(p.reasons)}</div></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
        ${isM ? chartCard("cBP", "Qon bosimi") + chartCard("cHb", "Gemoglobin va glyukoza") : chartCard("cNB", "Harorat va nafas") + chartCard("cW", "Vazn")}
      </div>
      <div class="card"><div class="hd"><h2>Ko'rsatkichlar tarixi</h2><span class="small muted">${p.observations.length} ta yozuv</span></div>
        <div class="bd flush table-wrap" style="max-height:420px"><table>
          <thead><tr><th>Vaqt</th><th>Manba</th><th>Qiymatlar</th><th>Belgilar</th></tr></thead>
          <tbody>${p.observations.map(o => {
            const vals = Object.entries(meta[k].parameters).filter(([key]) => o[key] != null).map(([key, s]) =>
              `${s.label.split(" ")[0]}: <b>${s.value_labels ? s.value_labels[o[key]] : o[key]}</b>`);
            if (o.sbp != null && o.dbp != null) { vals.splice(0, 2, `QB: <b>${o.sbp}/${o.dbp}</b>`); }
            return `<tr style="cursor:default"><td class="small">${fmtDate(o.recorded_at)}</td>
              <td><span class="badge ${o.source === "self" ? "self" : ""}">${SOURCE_UZ[o.source]}</span></td>
              <td class="small">${vals.join(" · ") || "—"}</td>
              <td class="small">${o.symptoms.map(s => esc(meta[k].symptoms[s]?.label || s)).join(", ") || '<span class="muted">—</span>'}</td></tr>`;
          }).join("")}</tbody></table></div></div>
    </div>

    <div class="grid" style="align-content:start">
      <div class="card"><div class="hd"><h2>Ma'lumotlar</h2></div><div class="bd"><dl class="kv">
        ${info}<dt>Telefon</dt><dd>${esc(p.phone || "—")}</dd><dt>Manzil</dt><dd>${esc(p.address || "—")}</dd>
      </dl></div></div>
      ${isM ? `<div class="card"><div class="hd"><h2>ML xavf bahosi</h2></div><div class="bd">${mlHTML(p.ml)}</div></div>` : ""}
      <div class="card"><div class="hd"><h2>Anamnez xavf omillari</h2></div><div class="bd">
        <div class="checks" id="rfChecks">${Object.entries(rfs).filter(([, s]) => !s.auto).map(([code, s]) =>
          `<label><input type="checkbox" value="${code}" ${p.risk_factors.includes(code) ? "checked" : ""}>${esc(s.label)}</label>`).join("")}</div>
        <div style="margin-top:10px"><button id="saveRf">Saqlash</button> <span class="small muted">Yosh, vazn, muddat — avtomatik hisoblanadi</span></div>
      </div></div>
      <div class="card"><div class="hd"><h2>Natija (ML uchun yorliq)</h2></div><div class="bd grid">
        <div class="small muted">Tug'ruq/kasallik natijasi keyinchalik modelni mahalliy ma'lumotda qayta o'qitish uchun ishlatiladi.</div>
        <div class="form-grid"><label>Natija<select id="outcome">${Object.entries(OUTCOMES).map(([v, l]) => `<option value="${v}" ${p.outcome === v || (!p.outcome && !v) ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label>Sana<input type="date" id="outcomeDate" value="${p.outcome_date || ""}"></label></div>
        <div><button id="saveOutcome">Saqlash</button></div>
      </div></div>
      <div class="card"><div class="hd"><h2>Xabarnomalar va audit</h2></div><div class="bd">
        ${p.alerts.map(a => `<div style="margin-bottom:12px"><div><span class="dot ${a.zone}"></span> <b>${esc(a.title)}</b> <span class="badge">${a.status}</span></div>
          <ul class="timeline" style="margin-top:4px">${a.events.map(e => `<li>${fmtDate(e.at)} — <b>${e.type}</b> ${esc(e.actor || "")} <span class="muted">${esc(e.detail || "")}</span></li>`).join("")}</ul></div>`).join("") || `<div class="muted">Xabarnoma bo'lmagan</div>`}
      </div></div>
    </div>
  </div>`;

  document.getElementById("addObs").onclick = openObs;
  document.getElementById("saveRf").onclick = async () => {
    const risk_factors = [...document.querySelectorAll("#rfChecks input:checked")].map(i => i.value);
    await api(`/api/patients/${pid}`, { method: "PATCH", body: { risk_factors } }); toast("Saqlandi, zona qayta hisoblandi"); load();
  };
  document.getElementById("saveOutcome").onclick = async () => {
    await api(`/api/patients/${pid}`, { method: "PATCH", body: { outcome: document.getElementById("outcome").value || null, outcome_date: document.getElementById("outcomeDate").value || null } });
    toast("Natija saqlandi");
  };
  drawCharts();
}

function drawCharts() {
  charts.forEach(c => c.destroy()); charts = [];
  const obs = [...P.observations].reverse();
  const series = key => obs.filter(o => o[key] != null).map(o => ({ x: parseUTC(o.recorded_at).getTime(), y: o[key], self: o.source === "self" }));
  const grid = cssVar("--border"), txt = cssVar("--muted");
  const ds = (label, key, color) => {
    const pts = series(key);
    return { label, data: pts, borderColor: color, backgroundColor: color, tension: .25, borderWidth: 2,
      pointRadius: pts.map(p => p.self ? 4 : 3), pointStyle: pts.map(p => p.self ? "triangle" : "circle") };
  };
  const band = (y, color) => ({ type: "line", label: "", data: [], borderColor: color });
  const opts = (yTitle, lines = []) => ({
    responsive: true, maintainAspectRatio: false, animation: false, parsing: false,
    plugins: { legend: { labels: { color: txt, boxWidth: 10 } }, tooltip: { callbacks: { title: i => fmtDate(new Date(i[0].parsed.x).toISOString()) } } },
    scales: { x: { type: "linear", ticks: { color: txt, callback: v => { const d = new Date(v); return `${d.getDate()}.${d.getMonth() + 1}`; }, maxTicksLimit: 6 }, grid: { color: grid } },
      y: { title: { display: true, text: yTitle, color: txt }, ticks: { color: txt }, grid: { color: ctx => lines.includes(ctx.tick.value) ? cssVar("--red") : grid } } },
  });
  const mk = (id, datasets, o) => { const el = document.getElementById(id); if (el) charts.push(new Chart(el, { type: "line", data: { datasets }, options: o })); };
  if (P.kind === "mother") {
    mk("cBP", [ds("Sistolik", "sbp", cssVar("--red")), ds("Diastolik", "dbp", cssVar("--accent"))], opts("mmHg", [140, 160, 90, 110]));
    const o2 = opts("g/L", [100, 70]);
    o2.scales.y2 = { position: "right", title: { display: true, text: "mmol/L", color: txt }, ticks: { color: txt }, grid: { display: false } };
    const glu = ds("Glyukoza", "glucose", cssVar("--yellow-dot")); glu.yAxisID = "y2";
    mk("cHb", [ds("Gemoglobin", "hemoglobin", cssVar("--green")), glu], o2);
  } else {
    const o = opts("°C"); o.scales.y2 = { position: "right", title: { display: true, text: "/min", color: txt }, ticks: { color: txt }, grid: { display: false } };
    const rr = ds("Nafas", "resp_rate", cssVar("--accent")); rr.yAxisID = "y2";
    mk("cNB", [ds("Harorat", "temperature", cssVar("--red")), rr], o);
    mk("cW", [ds("Vazn (kg)", "weight", cssVar("--green"))], opts("kg"));
  }
}

function openObs() {
  const k = P.kind === "mother" ? "mother" : "newborn";
  const params = { ...meta[k].parameters, weight: { label: "Vazn", unit: "kg" } };
  document.getElementById("obsFields").innerHTML = Object.entries(params).map(([key, s]) => s.value_labels
    ? `<label>${s.label}<select name="${key}"><option value="">—</option>${Object.entries(s.value_labels).map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></label>`
    : `<label>${s.label} ${s.unit ? `(${s.unit})` : ""}<input name="${key}" type="number" step="any" inputmode="decimal"></label>`).join("");
  document.getElementById("obsSymptoms").innerHTML = Object.entries(meta[k].symptoms).map(([code, s]) =>
    `<label class="${s.zone === "red" ? "red-sign" : ""}"><input type="checkbox" name="sym" value="${code}"><span class="dot ${s.zone}"></span>${esc(s.label)}</label>`).join("");
  document.getElementById("obsDlg").showModal();
}

document.getElementById("obsForm").addEventListener("submit", async e => {
  if (e.submitter?.value !== "save") return;
  e.preventDefault();
  const f = new FormData(e.target), body = { symptoms: f.getAll("sym") };
  for (const [key, v] of f.entries()) {
    if (key === "sym" || v === "") continue;
    body[key] = ["source", "entered_by", "note"].includes(key) ? v : Number(v);
  }
  try {
    const r = await api(`/api/patients/${pid}/observations`, { method: "POST", body });
    document.getElementById("obsDlg").close(); e.target.reset();
    toast(`Saqlandi. Zona: ${ZONE_UZ[r.zone]}${r.prev_zone && r.prev_zone !== r.zone ? ` (oldin: ${ZONE_UZ[r.prev_zone]})` : ""}`, 5000);
    load();
  } catch (err) { toast("Xatolik: " + err.message, 6000); }
});

async function load() { P = await api(`/api/patients/${pid}`); render(); }
(async () => { meta = await api("/api/meta"); await load(); })();
</script>
</body>
</html>
